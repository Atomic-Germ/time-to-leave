name: PR Checks
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  'Checking':
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      # Simplified Ubuntu setup - just use system ChromeDriver
      - name: 'Setup Display and ChromeDriver (Ubuntu)'
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Setup virtual display
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          
          # Install ChromeDriver via system package manager (much simpler!)
          sudo apt-get update
          sudo apt-get install -y chromium-driver
          
          # Verify installation
          chromedriver --version

      - name: 'Install Dependencies'
        run: npm ci

      - name: 'Install Playwright Browsers'
        run: npx playwright install --with-deps chromium

      - name: 'Lint Check'
        run: npm run lint

      - name: 'Setup Display and ChromeDriver (Ubuntu)'
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Setup D-Bus and display for Electron on Ubuntu
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          sudo mkdir -p $XDG_RUNTIME_DIR
          sudo chmod 700 $XDG_RUNTIME_DIR
          sudo chown $(id -un):$(id -gn) $XDG_RUNTIME_DIR
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          
          # Start virtual display for Electron
          export DISPLAY=':99'
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 3  # Give Xvfb time to start

      - name: 'Run Tests with Coverage'
        run: |
          # Run comprehensive test suite with enhanced coverage
          npm run test:ci
          
          # Generate additional coverage sources for CodeCov
          npm run coverage:ci

      - name: 'Verify Coverage Files (Unix)'
        if: matrix.os != 'windows-latest'
        run: |
          echo "📊 Checking all coverage files for CodeCov upload..."
          
          # Standard coverage files
          ls -la coverage_mocha/ || echo "⚠️ coverage_mocha directory not found"
          ls -la coverage_c8/ || echo "⚠️ coverage_c8 directory not found"
          
          # Enhanced coverage files
          ls -la coverage_nyc/ || echo "⚠️ coverage_nyc directory not found"
          ls -la coverage_combined/ || echo "⚠️ coverage_combined directory not found"
          
          # List all coverage files that will be uploaded
          echo "📤 Coverage files for CodeCov:"
          find . -name "coverage-final.json" -o -name "lcov.info" | grep -E "(coverage_|coverage/)" | sort

      - name: 'Verify Coverage Files (Windows)'
        if: matrix.os == 'windows-latest'
        run: |
          echo "📊 Checking all coverage files for CodeCov upload..."
          
          # Standard coverage files
          if (Test-Path "coverage_mocha") { Get-ChildItem coverage_mocha } else { echo "⚠️ coverage_mocha directory not found" }
          if (Test-Path "coverage_c8") { Get-ChildItem coverage_c8 } else { echo "⚠️ coverage_c8 directory not found" }
          
          # Enhanced coverage files  
          if (Test-Path "coverage_nyc") { Get-ChildItem coverage_nyc } else { echo "⚠️ coverage_nyc directory not found" }
          if (Test-Path "coverage_combined") { Get-ChildItem coverage_combined } else { echo "⚠️ coverage_combined directory not found" }
          
          # List all coverage files that will be uploaded
          echo "📤 Coverage files for CodeCov:"
          Get-ChildItem -Recurse -Include "coverage-final.json", "lcov.info" | Where-Object { $_.Directory.Name -match "coverage" } | Sort-Object FullName

      - name: 'Upload Enhanced Coverage to Codecov'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage_mocha/coverage-final.json,coverage_c8/coverage-final.json,coverage_nyc/coverage-final.json,coverage_combined/lcov.info,coverage_mocha/lcov.info,coverage_c8/lcov.info,coverage_nyc/lcov.info,coverage_playwright/lcov.info
          flags: unittests,enhanced-coverage,${{ matrix.os }}
          name: codecov-enhanced-${{ matrix.os }}
          fail_ci_if_error: false
          verbose: true
          directory: ./
