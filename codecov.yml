coverage:
  precision: 2
  round: down
  range: "53...100"
  comment: false
  
  # Support for multiple coverage sources
  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
      enhanced:
        target: auto
        threshold: 1%
        flags:
          - enhanced-coverage
        if_ci_failed: ignore
    patch:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error

# Flag configuration for different coverage types
flags:
  unittests:
    paths:
      - js/
      - src/
      - main.mjs
  enhanced-coverage:
    paths:
      - js/
      - src/
      - main.mjs
      - renderer/