<!DOCTYPE html>
<html data-theme="" lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none';">

    <title>Time to Leave</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">

    <!-- Scripts -->
    <script src="../node_modules/jquery/dist/jquery.min.js" charset="utf-8"></script>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js" charset="utf-8"></script>
    <script src="../node_modules/jquery-mousewheel/jquery.mousewheel.js"></script>
    <script type="module" src="./calendar.js" charset="utf-8"></script>
</head>

<body>
    <!-- Skip to main content link for keyboard navigation -->
    <a href="#main-content" class="skip-link" data-i18n="$Generic.skipToMain">Skip to main content</a>
    
    <!-- Main application content -->
    <main id="main-content" class="container" role="main" aria-label="Time tracking calendar">
        <header class="app-header" role="banner">
            <h1 class="sr-only" data-i18n="$Calendar.appTitle">Time to Leave - Work Time Tracker</h1>
        </header>
        
        <section id="calendar" aria-label="Calendar view" role="region">
            <!-- Calendar content will be dynamically loaded here -->
        </section>
    </main>
    
    <!-- Application footer -->
    <footer id="footer" class="footer" role="contentinfo" aria-label="Application information">
        <!-- Footer content will be dynamically loaded here -->
    </footer>
</body>

</html>
